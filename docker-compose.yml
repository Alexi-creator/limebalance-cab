services:
  web:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file: .env
    environment:
      # the backend runs on the host, so proxy /api there instead of the container localhost
      - VITE_DEV_PROXY_TARGET=http://host.docker.internal:3000
    extra_hosts:
      # needed on Linux hosts; Docker Desktop (Mac/Win) already resolves it
      - "host.docker.internal:host-gateway"
